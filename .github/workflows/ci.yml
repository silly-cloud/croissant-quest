name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cq
          POSTGRES_PASSWORD: cq
          POSTGRES_DB: cq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cq -d cq_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cq:cq@localhost:5432/cq_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests and question-bank validation
        run: pnpm test
      - name: API end-to-end (real Postgres)
        run: pnpm --filter @cq/api test:e2e
      - name: Build
        run: pnpm build
      - name: Web end-to-end and accessibility
        run: |
          pnpm --filter @cq/web exec playwright install --with-deps chromium
          pnpm --filter @cq/web test:e2e
